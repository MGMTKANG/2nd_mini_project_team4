server:
    port: 8084

spring:
    application:
        name: ai-service
    config:
        import:
        - "optional:file:./.env[.properties]"
        - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
    cloud:
        config:
            enabled: ${CONFIG_ENABLED:false}
        openfeign:
            client:
                config:
                    default:
                        # 공통 규약: 연결 1초, 응답 3초
                        connect-timeout: 1000
                        read-timeout: 3000
    ai:
        openai:
            api-key: ${OPEN_AI_KEY}
            chat:
                options:
                    model: ${OPEN_AI_MODEL:gpt-4o-mini}

eureka:
    client:
        enabled: ${EUREKA_ENABLED:false}
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info

# user-service가 발급한 JWT 확인용. user-service와 같은 값을 써야 한다
jwt:
    secret: ${JWT_SECRET_KEY}

# 매치 서비스 주소. Eureka 연동 후에는 url을 비우고 서비스 이름으로 찾는다.
clients:
    match-service:
        url: ${MATCH_SERVICE_URL:http://localhost:8082}
    user-service:
        url: ${USER_SERVICE_URL:http://localhost:8081}