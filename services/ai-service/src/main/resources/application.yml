server:
    port: 8084

spring:
    application:
        name: ai-service
    config:
        import:
        - "optional:file:./.env[.properties]"
        - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
    cloud:
        config:
            enabled: ${CONFIG_ENABLED:false}
    ai:
        openai:
            api-key: ${OPEN_AI_KEY}
            chat:
                options:
                    model: ${OPEN_AI_MODEL:gpt-4o-mini}

eureka:
    client:
        enabled: ${EUREKA_ENABLED:false}
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info