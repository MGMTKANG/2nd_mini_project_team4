name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/sporty
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sporty_ci
          MARIADB_USER: sporty_ci
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_DRIVER: org.mariadb.jdbc.Driver
      DB_URL: jdbc:mariadb://localhost:3306/sporty_ci
      DB_USERNAME: sporty_ci
      DB_PASSWORD: ci-only-password
      OPEN_AI_KEY: ci-placeholder-not-a-real-key
      OPEN_AI_MODEL: gpt-4o-mini
      JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters-long
      OPENAPI_SERVICE_KEY: ci-placeholder
      OPENAPI_CALLBACKURL: http://127.0.0.1
      OPENAPI_TYPE: json
      PUBLIC_DATA_API_KEY: ci-placeholder
      PUBLIC_DATA_API_URL: http://127.0.0.1:9999
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run default tests
        # build.gradle excludes integration-tagged tests from this task.
        run: bash ./gradlew clean build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/sporty/build/reports/tests/
            backend/sporty/build/test-results/
          if-no-files-found: ignore

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
  
  match:
    name: Match service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test match service
        run: >
          bash backend/sporty/gradlew
          -p services/match-service
          clean build --no-daemon

      - name: Upload match service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-service-test-reports
          path: |
            services/match-service/build/reports/tests/
            services/match-service/build/test-results/
          if-no-files-found: ignore
  
  publish-match:
    name: Publish match image to ECR
    needs: [backend, frontend, match]
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.push-image.outputs.image_uri }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: team4/match-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check OIDC claims
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              repository: claims.repository,
              ref: claims.ref
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088153173875:role/team4-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push match image
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 \
            -t "$IMAGE_URI" \
            services/match-service

          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "### Match service image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

  update-deployments:
    name: Update match, facility and user deployment images
    needs: [publish-match, publish-facility, publish-user]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Commit the published image URIs
        env:
          MATCH_IMAGE_URI: ${{ needs.publish-match.outputs.image_uri }}
          FACILITY_IMAGE_URI: ${{ needs.publish-facility.outputs.image_uri }}
          USER_IMAGE_URI: ${{ needs.publish-user.outputs.image_uri }}
        run: |
          set -euo pipefail

          remote_head=$(git ls-remote origin refs/heads/develop | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "develop has moved since this build. Skipping image update."
            exit 0
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          updates = {}
          for service in ("match", "facility", "user"):
              manifest = Path("k8s") / f"{service}-service" / "deployment.yaml"
              image_uri = os.environ[f"{service.upper()}_IMAGE_URI"]
              image_repo = f"088153173875.dkr.ecr.ap-northeast-2.amazonaws.com/team4/{service}-service"
              expected_prefix = f'{image_repo}:sha-{os.environ["GITHUB_SHA"]}-'

              if not re.fullmatch(re.escape(expected_prefix) + r"\d+-\d+", image_uri):
                  raise SystemExit(f"Unexpected {service}-service image URI")

              updated, count = re.subn(
                  r"^([ \t]*image:[ \t]*)" + re.escape(image_repo) + r":[^\r\n]+$",
                  lambda match: match.group(1) + image_uri,
                  manifest.read_text(),
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one {service}-service image line")
              updates[manifest] = updated

          for manifest, updated in updates.items():
              manifest.write_text(updated)
          PY

          if git diff --quiet -- k8s/match-service/deployment.yaml k8s/facility-service/deployment.yaml k8s/user-service/deployment.yaml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- k8s/match-service/deployment.yaml k8s/facility-service/deployment.yaml k8s/user-service/deployment.yaml
          git commit -m "chore(deploy): match·facility·user 이미지 갱신"
          git push origin HEAD:refs/heads/develop
  facility:
    name: Facility service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test facility service
        run: >
          bash backend/sporty/gradlew
          -p services/facility-service
          clean build --no-daemon

      - name: Upload facility service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facility-service-test-reports
          path: |
            services/facility-service/build/reports/tests/
            services/facility-service/build/test-results/
          if-no-files-found: ignore
  
  publish-facility:
    name: Publish facility image to ECR
    needs: [backend, frontend, facility]
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.push-image.outputs.image_uri }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: team4/facility-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check OIDC claims
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              repository: claims.repository,
              ref: claims.ref
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088153173875:role/team4-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push facility image
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 \
            -t "$IMAGE_URI" \
            services/facility-service

          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "### Facility service image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

  # config 설정
  config:
    name: Config service build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build config service
        run: >-
          bash services/config-service/gradlew
          -p services/config-service
          clean build --no-daemon

  publish-config:
    name: Publish config image to ECR
    needs: [backend, frontend, config]
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: team4/config-service

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088153173875:role/team4-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push config image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 \
            -t "$IMAGE_URI" \
            services/config-service

          docker push "$IMAGE_URI"

          echo "### Config service image" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"

  user:
    name: User service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test user service
        run: >
          bash backend/sporty/gradlew
          -p services/user-service
          clean build --no-daemon

      - name: Upload user service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-test-reports
          path: |
            services/user-service/build/reports/tests/
            services/user-service/build/test-results/
          if-no-files-found: ignore


  publish-user:
    name: Publish user image to ECR
    needs: [frontend, user]
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.push-image.outputs.image_uri }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: team4/user-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check OIDC claims
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              repository: claims.repository,
              ref: claims.ref
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088153173875:role/team4-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push user image
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 \
            -t "$IMAGE_URI" \
            services/user-service

          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "### User service image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
