name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/sporty
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sporty_ci
          MARIADB_USER: sporty_ci
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_DRIVER: org.mariadb.jdbc.Driver
      DB_URL: jdbc:mariadb://localhost:3306/sporty_ci
      DB_USERNAME: sporty_ci
      DB_PASSWORD: ci-only-password
      OPEN_AI_KEY: ci-placeholder-not-a-real-key
      OPEN_AI_MODEL: gpt-4o-mini
      JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters-long
      OPENAPI_SERVICE_KEY: ci-placeholder
      OPENAPI_CALLBACKURL: http://127.0.0.1
      OPENAPI_TYPE: json
      PUBLIC_DATA_API_KEY: ci-placeholder
      PUBLIC_DATA_API_URL: http://127.0.0.1:9999
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run default tests
        # build.gradle excludes integration-tagged tests from this task.
        run: bash ./gradlew clean build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/sporty/build/reports/tests/
            backend/sporty/build/test-results/
          if-no-files-found: ignore

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
  
  match:
    name: Match service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test match service
        run: >
          bash backend/sporty/gradlew
          -p services/match-service
          clean build --no-daemon

      - name: Upload match service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-service-test-reports
          path: |
            services/match-service/build/reports/tests/
            services/match-service/build/test-results/
          if-no-files-found: ignore
  
  publish-match:
    name: Publish match image to ECR
    needs: [backend, frontend, match]
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: team4/match-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              repository: claims.repository,
              ref: claims.ref
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088153173875:role/team4-github-match-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push match image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 \
            -t "$IMAGE_URI" \
            services/match-service

          docker push "$IMAGE_URI"

          echo "### Match service image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"