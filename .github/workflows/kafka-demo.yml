name: Kafka demo configuration

on:
  pull_request:
    paths:
      - 'deploy/kafka-demo/**'
      - '.github/workflows/kafka-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-render test dependencies
        run: |
          python -m pip install -r deploy/kafka-demo/requirements-test.txt
          mkdir -p "$RUNNER_TEMP/kafka-demo-bin"
          cd "$RUNNER_TEMP/kafka-demo-bin"
          curl -fsSLO https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/kafka-demo-bin" >> "$GITHUB_PATH"
      - name: Validate rendered Kubernetes resources without a cluster
        run: python -m unittest discover -s deploy/kafka-demo -p 'test_*.py' -v
      - name: Verify broker messaging and restart persistence in disposable Docker resources
        run: python deploy/kafka-demo/smoke_test.py
