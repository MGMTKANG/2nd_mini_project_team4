apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: sporty
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: service-discovery
          image: 088153173875.dkr.ecr.ap-northeast-2.amazonaws.com/team4/service-discovery:sha-01e4fd9d4bb510aacaa91f2f4d7347654c4d0c7f-41798232473-1
          ports:
            - name: http
              containerPort: 8761
          env:
            - name: TZ
              value: Asia/Seoul
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
