apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: sporty
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
        workload-group: sporty-apps
    spec:
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              workload-group: sporty-apps
      containers:
        - name: service-discovery
          image: 088153173875.dkr.ecr.ap-northeast-2.amazonaws.com/team4/service-discovery:sha-371ede3decd2191fc130e32550556b81039bab98-41899767207-1
          ports:
            - name: http
              containerPort: 8761
          env:
            - name: TZ
              value: Asia/Seoul
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
