apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: sporty
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      terminationGracePeriodSeconds: 40
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: ai-service
          image: 088153173875.dkr.ecr.ap-northeast-2.amazonaws.com/team4/ai-service:sha-371ede3decd2191fc130e32550556b81039bab98-41899767207-1
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sporty-jwt-secret
                  key: JWT_SECRET
            - name: OPEN_AI_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: OPEN_AI_KEY
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: MATCH_SERVICE_URL
              value: "http://match-service:8082"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: CONFIG_ENABLED
              value: "false"
            - name: EUREKA_ENABLED
              value: "false"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
