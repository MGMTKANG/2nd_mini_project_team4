apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: sporty
spec:
  clusterIP: None
  # The static KRaft voter DNS must resolve before the broker becomes Ready.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: sporty
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
