apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cluster-identity
  namespace: sporty
# This ID is not a secret. Keep it unchanged for the lifetime of the PVC.
immutable: true
data:
  CLUSTER_ID: AdMr8KwtRq-2_GCTsL5otA
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: sporty
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0.kafka-headless.sporty.svc.cluster.local:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka-headless.sporty.svc.cluster.local:9093
  KAFKA_LOG_DIRS: /mnt/kafka/data/logs
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_MIN_INSYNC_REPLICAS: "1"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_RETENTION_HOURS: "168"
  KAFKA_LOG_RETENTION_BYTES: "1073741824"
  KAFKA_LOG_SEGMENT_BYTES: "134217728"
